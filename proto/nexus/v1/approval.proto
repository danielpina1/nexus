syntax = "proto3";

package nexus.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "nexus/v1/common.proto";
import "nexus/v1/security.proto";

enum ApprovalState {
  APPROVAL_STATE_UNSPECIFIED = 0;
  APPROVAL_STATE_PENDING = 1;
  APPROVAL_STATE_APPROVED = 2;
  APPROVAL_STATE_DENIED = 3;
  APPROVAL_STATE_EXPIRED = 4;
}

// Approval is a pending human decision on an action.
message Approval {
  string id = 1;
  string task_id = 2;
  string run_id = 3;
  string agent_id = 4;
  ActionClass action_class = 5;
  TrustLevel level = 6;
  string title = 7; // "Checkout €84.30 at Continente"
  string summary = 8;
  google.protobuf.Struct payload = 9; // exact action preview
  repeated Attachment previews = 10; // screenshots, diffs
  // SHA-256 of the canonical payload; biometric approvals sign this.
  bytes payload_hash = 11;
  // Random challenge for biometric signatures.
  bytes challenge = 12;
  ApprovalState state = 13;
  google.protobuf.Timestamp expires_at = 14;
  google.protobuf.Timestamp created_at = 15;
  // Exact action preview sealed by the executing Node to the device; the phone
  // recomputes action hash from it (what you see is what you sign).
  SealedEnvelope sealed_preview = 16;
  string node_id = 17;
}

// ApprovalService lists and decides approvals.
service ApprovalService {
  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse);
  rpc Decide(DecideRequest) returns (DecideResponse);
}

message ListApprovalsRequest {
  repeated ApprovalState states = 1;
}

message ListApprovalsResponse {
  repeated Approval approvals = 1;
}

message DecideRequest {
  // Signed decision, forwarded unchanged to the Node, which verifies it itself.
  SignedApproval decision = 1;
  string comment = 2;
  // Remember this decision for this agent + action pattern (earned autonomy suggestion).
  bool remember = 3;
}

message DecideResponse {
  Approval approval = 1;
}
