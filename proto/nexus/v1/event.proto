syntax = "proto3";

package nexus.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "nexus/v1/approval.proto";
import "nexus/v1/common.proto";
import "nexus/v1/node.proto";
import "nexus/v1/task.proto";

// Event is one entry of the Hub's ordered event log.
message Event {
  int64 seq = 1; // monotonically increasing, global
  google.protobuf.Timestamp at = 2;
  string task_id = 3;
  string run_id = 4;
  string actor = 5; // device:<id> | agent:<id> | node:<id> | hub
  // Root of the task tree the event belongs to (set by the hub for task
  // events), so a client can follow a whole team run.
  string root_task_id = 6;

  oneof body {
    TaskUpdated task_updated = 10;
    RunOutput run_output = 11;
    ToolCall tool_call = 12;
    ToolResult tool_result = 13;
    Question question = 14;
    Approval approval = 15;
    CostRecorded cost = 16;
    ArtifactAdded artifact = 17;
    NodeStatus node_status = 18;
    Notice notice = 19;
    UserMessage user_message = 20;
    TeamEvent team = 21;
  }
}

enum TeamEventKind {
  TEAM_EVENT_KIND_UNSPECIFIED = 0;
  TEAM_EVENT_KIND_STARTED = 1; // team run started (task_id = root)
  TEAM_EVENT_KIND_DELEGATED = 2; // a member task was created (task_id = child)
  TEAM_EVENT_KIND_SPAWNED = 3; // an ephemeral specialist was created
  TEAM_EVENT_KIND_MEMBER_FINISHED = 4; // a member task ended (data.state)
  TEAM_EVENT_KIND_BLACKBOARD_UPDATED = 5; // key, data.value
  TEAM_EVENT_KIND_MESSAGE_SENT = 6; // text, data.to, data.delivered_to
  TEAM_EVENT_KIND_REPORTED = 7; // a member reported a structured result
  TEAM_EVENT_KIND_AWAITING = 8; // the orchestrator waits for data.task_ids
  TEAM_EVENT_KIND_STRATEGY_STEP = 9; // hub-driven strategy progress (text)
  TEAM_EVENT_KIND_REVIEW = 10; // critic verdict (data.approved, data.feedback, data.round)
  TEAM_EVENT_KIND_LIMIT_REACHED = 11; // a tree limit stopped something (text)
  TEAM_EVENT_KIND_APPROVAL_PENDING = 12; // a member waits for an approval (data.approval_id)
  TEAM_EVENT_KIND_FINISHED = 13; // the team run ended (data.state)
}

// TeamEvent is a team / task-tree lifecycle event. Event.task_id is the
// root task; task_id here is the task the event is about.
message TeamEvent {
  TeamEventKind kind = 1;
  string team_id = 2;
  string root_task_id = 3;
  string task_id = 4;
  string role = 5;
  string agent_id = 6;
  string text = 7;
  string key = 8; // blackboard key
  google.protobuf.Struct data = 9;
}

message TaskUpdated {
  Task task = 1;
}

// RunOutput is a streamed chunk of agent text.
message RunOutput {
  string text = 1;
  bool is_final = 2;
}

message ToolCall {
  string call_id = 1;
  string tool = 2;
  google.protobuf.Struct input = 3;
  ActionClass action_class = 4;
}

message ToolResult {
  string call_id = 1;
  google.protobuf.Struct output = 2;
  string error = 3;
  int64 duration_ms = 4;
}

// Question is an ask_user request.
message Question {
  string question_id = 1;
  string text = 2;
  repeated string choices = 3;
  bool allow_free_text = 4;
}

message CostRecorded {
  Cost cost = 1;
}

message ArtifactAdded {
  Attachment attachment = 1;
}

message UserMessage {
  string text = 1;
  repeated Attachment attachments = 2;
}

enum NoticeKind {
  NOTICE_KIND_UNSPECIFIED = 0;
  NOTICE_KIND_RESULT = 1;
  NOTICE_KIND_ALERT = 2;
  NOTICE_KIND_SUGGESTION = 3;
  NOTICE_KIND_FACT_REVIEW = 4;
  NOTICE_KIND_BRIEF = 5;
}

// Notice is an Inbox card that needs no immediate response.
message Notice {
  string id = 1;
  NoticeKind kind = 2;
  string title = 3;
  string body = 4;
  google.protobuf.Struct data = 5;
  repeated NoteRef notes = 6;
}

// EventService streams the event log to clients.
service EventService {
  // Subscribe replays events after since_seq, then streams live events.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
}

message SubscribeRequest {
  int64 since_seq = 1;
  // Optional filters; empty = everything the device may see.
  repeated string task_ids = 2;
  bool inbox_only = 3;
  // Only events of these task trees (Event.root_task_id).
  repeated string root_task_ids = 4;
}

message SubscribeResponse {
  Event event = 1;
}
