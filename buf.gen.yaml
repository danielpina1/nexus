# Run `make gen` (or `buf generate`) from the repo root after editing proto/.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/danielpina1/nexus/backend/gen
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.6
    out: backend/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.18.1
    out: backend/gen
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es
    out: web/src/gen
    opt: target=ts
    include_imports: true
  - remote: buf.build/apple/swift
    out: ios/NexusKit/Sources/NexusAPI/Generated
    opt: Visibility=Public,FileNaming=PathToUnderscores
  - remote: buf.build/connectrpc/swift
    out: ios/NexusKit/Sources/NexusAPI/Generated
    opt: Visibility=Public,FileNaming=PathToUnderscores
