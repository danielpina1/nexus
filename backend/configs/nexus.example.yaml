# nexus.yaml — Nexus hub (nexusd) configuration.
#
# Every top-level key other than data_dir/modules is the config section of the
# module (or subsystem) with that name. Missing sections use defaults.
# Values like ${VAR} are NOT expanded by nexusd; secrets are read from the
# environment variables named by the *_env keys instead.

# Where modules keep their state (each module gets <data_dir>/<module>/).
data_dir: ./data

# Which modules run. Modules marked DefaultEnabled run unless disabled here;
# `nexusd modules` lists them all.
modules:
  enable: []
  disable: []

# --- HTTP API server --------------------------------------------------------
server:
  # Bind address. Behind a UniFi Gateway bind to the hub's fixed IP on the
  # nexus network, e.g. "10.20.0.10:7700" (docs/NETWORK.md).
  listen: ":7700"
  # Built web dashboard (`make web` → web/dist), e.g. ./web/dist.
  # Empty: a placeholder page is served. Relative paths in this file are
  # resolved against nexusd's working directory.
  web_dir: ""
  cors:
    # Browser origins allowed to call the API. "*" allows any origin.
    # Omit to allow the Vite dev server (localhost:5173) only.
    allowed_origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  tls:
    # TLS 1.3 + HTTP/2 with a certificate issued by the hub's private CA
    # (<data_dir>/security/pki/ca.crt, created on first start). SANs =
    # security.server_names + the listen IP. Phones and nodes pin this CA at
    # pairing. false = plain HTTP/1.1 + h2c (development only).
    auto: true
    # Or your own certificate (instead of auto):
    cert: ""   # path to PEM certificate
    key: ""    # path to PEM private key

# --- Operational database (module: store) ------------------------------------
store:
  # SQLite file; default <data_dir>/store/nexus.db
  path: ""

# --- Event log (module: events) ----------------------------------------------
events:
  # Live events buffered per subscriber before a slow client is dropped
  # (it then resumes from its last seq).
  subscriber_buffer: 4096

# --- Security (module: security) ---------------------------------------------
security:
  # Development bearer token: clients send `Authorization: Bearer <dev_token>`.
  # `nexusd init` generates a random one. Remove once device pairing is set up.
  dev_token: CHANGE_ME
  # URLs phones and nodes use to reach the hub; put in pairing QRs
  # (`nexusd init -hub-url ...` sets them).
  hub_urls: ["https://nexus.home.arpa:7700"]
  # Hub certificate SANs: the hostnames/IPs of hub_urls (+ local access).
  server_names: ["nexus.home.arpa", "localhost", "127.0.0.1"]
  # Static node credentials as "node-id:token" (prefer pairing + mTLS).
  node_tokens:
    # - mac-studio:CHANGE_ME

# --- Vault (module: vault) ---------------------------------------------------
vault:
  # Obsidian-compatible Markdown vault (git repository). `nexusd init` copies
  # vault-template/ here.
  path: ./vault
  # Commit changes made through Nexus automatically.
  auto_commit: true
  # Optional git remote to push/pull (e.g. for Obsidian on other machines).
  remote: ""

# --- LLM access (module: llm) ------------------------------------------------
# Every model call from the hub (router, memory/vault Ask) goes through here.
# Check the setup with `nexusd llm check` and list models with
# `nexusd llm models`. See docs/MODELS.md.
llm:
  # Provider for raw model names (default: first provider by name).
  default_provider: ollama
  # Fill aliases whose model is CHANGE_ME/empty from the models the providers
  # list (smart prefers "sonnet"/"gpt-4…", best "opus"/"gpt-5", fast-local
  # "haiku"/"mini"/"llama"/"qwen", embed "embed"). Explicit models always win.
  aliases_auto: true
  # alias_preferences:              # override the preference substrings
  #   smart: [qwen2.5:14b, llama3.1]
  providers:
    # Local models through Ollama's OpenAI-compatible API ("/v1" is appended
    # when the URL has no path). For another machine on the LAN/Tailscale use
    # its address, e.g. http://gpu-box.tailnet.ts.net:11434, and start Ollama
    # with OLLAMA_HOST=0.0.0.0.
    ollama:
      base_url: http://localhost:11434/v1
      api: openai                   # openai (default) | anthropic
      auth: none                    # bearer (default) | header | none
      timeout: 300s                 # local models may need time to load
    # A cloud API or any OpenAI-/Anthropic-compatible gateway (LiteLLM,
    # OpenRouter, vLLM, …). Uncomment and set the key in the environment.
    # cloud:
    #   base_url: https://api.anthropic.com     # or https://gateway.lan:4000/v1
    #   api: anthropic                          # or openai
    #   api_key_env: CLOUD_API_KEY              # anthropic: sent as x-api-key
    #   # auth: bearer                          # force Authorization: Bearer
    #   # auth_header: X-Api-Key                # custom key header
    #   # ca_file: /etc/nexus/gateway-ca.pem    # private CA / self-signed TLS
    #   #                                       # (insecure_skip_verify is refused)
  # Model aliases used by agents and the router (mirrors vault
  # policies/models.md). CHANGE_ME = pick automatically (aliases_auto).
  aliases:
    fast-local: { provider: ollama, model: CHANGE_ME }
    smart:      { provider: ollama, model: CHANGE_ME }
    best:       { provider: ollama, model: CHANGE_ME }
    embed:      { provider: ollama, model: CHANGE_ME }
    # With a cloud provider, keep a local fallback so basic commands work
    # offline (embed never falls back to a different model):
    # smart:
    #   provider: cloud
    #   model: claude-sonnet-4-5
    #   fallback: [{ provider: ollama, model: "qwen2.5:14b" }]
  # Provider health: after failure_threshold consecutive failures a provider
  # is skipped for cooldown (doubling up to max_cooldown) while fallbacks serve.
  health:
    failure_threshold: 3
    cooldown: 15s
    max_cooldown: 5m
  # Retries per target on 429/5xx/network errors.
  max_retries: 3
  # Optional price table (per million tokens) for cost tracking.
  # currency: EUR
  # prices:
  #   claude-sonnet-4-5: { input: 3.0, output: 15.0 }

# --- Command router (module: router) -----------------------------------------
router:
  # Model alias used to classify free-form input.
  classifier: fast-local
  # Alias used when the classifier is unavailable or unsure.
  fallback: smart
  # Below this confidence the router asks the user to choose.
  min_confidence: 0.75

# --- Node link (module: nodelink) --------------------------------------------
nodelink:
  # Pre-shared node tokens until mTLS pairing lands. Nodes send
  # `Authorization: Bearer <token>` and `X-Nexus-Node-Id: <id>`.
  tokens:
    # mac-studio: CHANGE_ME
    # vps: CHANGE_ME
  # Mark a node offline after this long without a heartbeat.
  heartbeat_timeout: 30s
